# gitleaks configuration: the default rules plus allowlists for known test fixtures.
# Run: gitleaks git --config .gitleaks.toml .
title = "Thoughts desktop"

[extend]
useDefault = true

[[rules]]
id = "private-key"

[[rules.allowlists]]
description = "Self-signed 'Thoughts test server' certificate key for the local TLS server in the Markdown folder import test, and the PEM snippets that test the encrypted-key check"
paths = ['''(^|/)autotests/markdownfolderimporttest\.cpp$''']

[[rules.allowlists]]
description = "The PEM begin/end markers sshPrivateKeyEncrypted() looks for, not a key"
condition = "AND"
paths = ['''(^|/)part/gitclone\.cpp$''']
regexTarget = "line"
regexes = ['''static const QByteArray begin\("-----BEGIN OPENSSH PRIVATE KEY-----"\)''']

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Synthetic OpenRouter keys in the read-aloud tests"
condition = "AND"
paths = ['''(^|/)autotests/readaloudtest\.cpp$''']
regexes = ['''^sk-or-v1-(0123456789abcdef)+$''', '''^sk-or-v1-saved-key-0123456789$''']

[[rules.allowlists]]
description = "Upstream Okular snapcraft.yaml (removed since): the public key id of the KDE neon package archive"
condition = "AND"
paths = ['''(^|/)snapcraft\.yaml$''']
regexTarget = "line"
regexes = ['''^\s*key-id:\s*[0-9A-F]{40}\s*$''']
